<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bugs & Issues - IsleTools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #000000; background-image: radial-gradient(circle at top, hsl(0, 0%, 8%), #000 60%); color: #EAEAEA; }
        .interactive-glow { position: relative; }
        .interactive-glow::before, .interactive-glow::after { content: ""; position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; border-radius: inherit; opacity: var(--glow-opacity, 0); transition: opacity 0.3s ease-in-out; }
        .interactive-glow::before { background: radial-gradient(var(--glow-size, 350px) circle at var(--mouse-x) var(--mouse-y), rgba(168, 85, 247, 0.1), transparent 40%); z-index: 1; }
        .interactive-glow::after { --border-size: 1px; background: conic-gradient(from var(--border-angle, 0deg) at 50% 50%, transparent, rgba(168, 85, 247, 0.8), transparent 20%); z-index: 0; inset: calc(-1 * var(--border-size)); -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
    </style>
</head>
<body>
    <div class="flex flex-col min-h-screen">
        <div class="sticky top-4 z-50 px-4">
            <header class="interactive-glow container mx-auto bg-gray-900/60 backdrop-blur-sm border border-gray-800 rounded-full">
                <nav class="px-4 py-2">
                    <div class="flex items-center justify-between">
                        <div class="text-white font-bold text-xl ml-2"><a href="index.html">IsleTools</a></div>
                        <div class="hidden md:flex items-center space-x-2 bg-gray-900/80 rounded-full p-1">
                            <a href="index.html" class="flex items-center gap-x-2 text-gray-400 hover:text-white hover:bg-gray-800/50 transition-all duration-300 px-3 py-1.5 rounded-full text-sm font-medium"><span class="material-icons-outlined text-base">home</span>Home</a>
                            <a href="blog.html" class="flex items-center gap-x-2 text-gray-400 hover:text-white hover:bg-gray-800/50 transition-all duration-300 px-3 py-1.5 rounded-full text-sm font-medium"><span class="material-icons-outlined text-base">article</span>Blog</a>
                            <a href="bugs.html" class="flex items-center gap-x-2 bg-gray-800 text-white transition-all duration-300 px-3 py-1.5 rounded-full text-sm font-medium"><span class="material-icons-outlined text-base">bug_report</span>Bugs & Issues</a>
                        </div>
                        <div class="hidden md:block"><a href="https://github.com/thetoprat/isletools" target="_blank" class="bg-gray-800 px-4 py-2 rounded-full text-sm font-medium text-white hover:bg-gray-700 transition-colors">GitHub</a></div>
                        <div class="md:hidden"><button id="mobile-menu-button" class="text-white focus:outline-none p-2"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path></svg></button></div>
                    </div>
                </nav>
            </header>
             <div id="mobile-menu" class="hidden md:hidden mt-2 bg-gray-900/90 backdrop-blur-sm border border-gray-800 rounded-2xl p-4 space-y-2">
                <a href="index.html" class="block text-gray-400 hover:text-white hover:bg-gray-800/50 transition-all duration-300 px-3 py-1.5 rounded-full text-sm font-medium text-center">Home</a>
                <a href="blog.html" class="block text-gray-400 hover:text-white hover:bg-gray-800/50 transition-all duration-300 px-3 py-1.5 rounded-full text-sm font-medium text-center">Blog</a>
                <a href="bugs.html" class="block bg-gray-800 text-white transition-all duration-300 px-3 py-1.5 rounded-full text-sm font-medium text-center">Bugs & Issues</a>
                <a href="https://github.com/thetoprat/isletools" target="_blank" class="block mt-2 bg-gray-800 px-4 py-2 rounded-lg text-sm font-medium text-white hover:bg-gray-700 transition text-center">GitHub</a>
            </div>
        </div>

        <main class="container mx-auto px-6 py-16 flex-grow">
            <div class="text-center mb-12 pt-12">
                <h1 class="text-4xl font-bold text-white">Bugs & Issues</h1>
                <p class="text-gray-400 mt-2">A live look at open issues from the GitHub repository.</p>
            </div>
            <div id="issues-container" class="max-w-4xl mx-auto space-y-4">
                <p class="text-center text-gray-400">Loading issues...</p>
            </div>
        </main>

        <footer class="border-t border-gray-900"><div class="container mx-auto px-6 py-8 text-center text-gray-500"><p>&copy; 2024 IsleTools. All Rights Reserved.</p></div></footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const GITHUB_REPO = "thetoprat/isletools";

            function setupGlowEffect() {
                document.querySelectorAll('.interactive-glow').forEach(elem => {
                    const rect = elem.getBoundingClientRect();
                    elem.style.setProperty('--glow-size', `${Math.max(rect.width, rect.height) * 1.5}px`);
                    elem.addEventListener('mousemove', e => {
                        const rect = elem.getBoundingClientRect();
                        const x = e.clientX - rect.left, y = e.clientY - rect.top;
                        const angle = Math.atan2(y - rect.height / 2, x - rect.width / 2) * (180 / Math.PI);
                        elem.style.setProperty('--mouse-x', `${x}px`);
                        elem.style.setProperty('--mouse-y', `${y}px`);
                        elem.style.setProperty('--border-angle', `${angle}deg`);
                    });
                    elem.addEventListener('mouseenter', () => elem.style.setProperty('--glow-opacity', 1));
                    elem.addEventListener('mouseleave', () => elem.style.setProperty('--glow-opacity', 0));
                });
            }

            async function fetchIssues() {
                const issuesContainer = document.getElementById('issues-container');
                try {
                    // FIX: Added per_page=100 to fetch more issues than the default 30
                    const response = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/issues?state=open&per_page=100`);
                    if (!response.ok) throw new Error(`GitHub API error: ${response.statusText}`);
                    const issues = await response.json();

                    if (issues.length === 0) {
                        issuesContainer.innerHTML = '<p class="text-center text-gray-400">No open issues found. Great job!</p>';
                        return;
                    }

                    issuesContainer.innerHTML = '';
                    issues.forEach(issue => {
                        if (issue.pull_request) return;

                        // REVERT: Changed back to a simple <a> tag
                        const issueEl = document.createElement('a');
                        issueEl.href = issue.html_url;
                        issueEl.target = "_blank"; // Open in new tab
                        issueEl.className = 'interactive-glow block bg-gray-900/50 border border-gray-800 rounded-lg p-5 hover:border-gray-700 transition-colors duration-300';

                        let labelsHTML = issue.labels.map(label => `<span class="text-xs font-semibold mr-2 px-2.5 py-0.5 rounded" style="background-color:#${label.color}; color:${getContrastYIQ(label.color)}">${label.name}</span>`).join('');
                        
                        const statusColor = issue.state === 'open' ? 'text-green-400' : 'text-purple-400';
                        const statusIcon = issue.state === 'open' ? 'adjust' : 'check_circle';

                        // REVERT: Simplified inner HTML to remove description and assignees from the card itself.
                        issueEl.innerHTML = `
                             <div class="flex justify-between items-start gap-4">
                                <div class="flex-grow">
                                    <div class="flex items-center gap-3 mb-2">
                                        <span class="material-icons-outlined ${statusColor}" style="font-size: 20px;">${statusIcon}</span>
                                        <h3 class="text-lg font-bold text-white">${issue.title}</h3>
                                    </div>
                                    <div class="pl-8">
                                        ${labelsHTML}
                                    </div>
                                </div>
                                <div class="text-right flex-shrink-0">
                                    <span class="font-semibold text-sm text-white">${issue.user.login}</span>
                                    <p class="text-xs text-gray-400">${new Date(issue.created_at).toLocaleDateString()}</p>
                                </div>
                            </div>
                        `;
                        issuesContainer.appendChild(issueEl);
                    });
                    setupGlowEffect();
                } catch (error) {
                    console.error("Failed to fetch issues:", error);
                    issuesContainer.innerHTML = `<p class="text-red-400 text-center">Could not load issues data.</p>`;
                }
            }
            
            function getContrastYIQ(hex){ hex = hex.replace("#", ""); const r = parseInt(hex.substr(0,2),16), g = parseInt(hex.substr(2,2),16), b = parseInt(hex.substr(4,2),16); return ((r*299)+(g*587)+(b*114))/1000 >= 128 ? 'black' : 'white'; }

            document.getElementById('mobile-menu-button').addEventListener('click', () => document.getElementById('mobile-menu').classList.toggle('hidden'));
            fetchIssues();
            setupGlowEffect();
        });
    </script>
</body>
</html>
