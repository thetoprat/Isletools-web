<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bugs & Issues - IsleTools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #000000; color: #EAEAEA; }
        .nav-link { @apply text-gray-400 hover:text-white transition-colors duration-300 px-3 py-2 rounded-md text-sm font-medium; }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="sticky top-0 z-50 bg-black/80 backdrop-blur-sm border-b border-gray-900">
        <nav class="container mx-auto px-6 py-4">
            <div class="flex items-center justify-between">
                <div class="text-white font-bold text-xl"><a href="index.html">IsleTools</a></div>
                <div class="hidden md:flex items-center space-x-1">
                    <a href="index.html" class="nav-link">Home</a>
                    <a href="blog.html" class="nav-link">Blog</a>
                    <a href="bugs.html" class="nav-link text-white">Bugs & Issues</a>
                    <a href="https://github.com/thetoprat/isletools" target="_blank" class="bg-gray-900 ml-4 px-4 py-2 rounded-lg text-sm font-medium text-white hover:bg-gray-800 transition">GitHub</a>
                </div>
                <div class="md:hidden">
                    <button id="mobile-menu-button" class="text-white focus:outline-none">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path></svg>
                    </button>
                </div>
            </div>
             <div id="mobile-menu" class="hidden md:hidden mt-4 space-y-2">
                <a href="index.html" class="block nav-link text-center">Home</a>
                <a href="blog.html" class="block nav-link text-center">Blog</a>
                <a href="bugs.html" class="block nav-link text-white text-center">Bugs & Issues</a>
                <a href="https://github.com/thetoprat/isletools" target="_blank" class="block mt-2 bg-gray-900 px-4 py-2 rounded-lg text-sm font-medium text-white hover:bg-gray-800 transition text-center">GitHub</a>
            </div>
        </nav>
    </header>

    <main class="container mx-auto px-6 py-16">
        <div class="text-center mb-12">
            <h1 class="text-4xl font-bold text-white">Bugs & Issues</h1>
            <p class="text-gray-400 mt-2">A live look at open issues from the GitHub repository.</p>
        </div>
        <div id="issues-container" class="max-w-4xl mx-auto space-y-4">
            <p class="text-center text-gray-400">Loading issues...</p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-gray-900 mt-20">
        <div class="container mx-auto px-6 py-8 text-center text-gray-500">
            <p>&copy; 2024 IsleTools. All Rights Reserved.</p>
        </div>
    </footer>

    <script>
        const GITHUB_REPO = "thetoprat/isletools";

        async function fetchIssues() {
            const issuesContainer = document.getElementById('issues-container');
            try {
                const response = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/issues?state=open`);
                if (!response.ok) throw new Error(`GitHub API error: ${response.statusText}`);
                const issues = await response.json();

                if (issues.length === 0) {
                    issuesContainer.innerHTML = '<p class="text-center text-gray-400">No open issues found. Great job!</p>';
                    return;
                }

                issuesContainer.innerHTML = ''; // Clear loading message
                issues.forEach(issue => {
                    if (issue.pull_request) return; // Filter out pull requests

                    const issueEl = document.createElement('a');
                    issueEl.href = issue.html_url;
                    issueEl.target = '_blank';
                    issueEl.className = 'block bg-gray-900/50 border border-gray-800 rounded-lg p-5 hover:border-gray-700 transition-colors duration-300';
                    
                    let labelsHTML = '';
                    issue.labels.forEach(label => {
                        labelsHTML += `<span class="text-xs font-semibold mr-2 px-2.5 py-0.5 rounded" style="background-color:#${label.color}; color:${getContrastYIQ(label.color)}">${label.name}</span>`;
                    });

                    issueEl.innerHTML = `
                        <div class="flex justify-between items-start">
                            <h3 class="text-lg font-bold text-white mb-2 pr-4">${issue.title}</h3>
                            <span class="text-gray-400 text-sm whitespace-nowrap">#${issue.number}</span>
                        </div>
                        <div class="flex items-center text-sm text-gray-400">
                            <span>Opened by ${issue.user.login} on ${new Date(issue.created_at).toLocaleDateString()}</span>
                        </div>
                        <div class="mt-3">${labelsHTML}</div>
                    `;
                    issuesContainer.appendChild(issueEl);
                });

            } catch (error) {
                console.error("Failed to fetch issues:", error);
                issuesContainer.innerHTML = `<p class="text-red-400 text-center">Could not load issues data.</p>`;
            }
        }
        
        // Function to determine text color (black/white) based on background hex color
        function getContrastYIQ(hexcolor){
            hexcolor = hexcolor.replace("#", "");
            const r = parseInt(hexcolor.substr(0,2),16);
            const g = parseInt(hexcolor.substr(2,2),16);
            const b = parseInt(hexcolor.substr(4,2),16);
            const yiq = ((r*299)+(g*587)+(b*114))/1000;
            return (yiq >= 128) ? 'black' : 'white';
        }

        document.addEventListener('DOMContentLoaded', () => {
             document.getElementById('mobile-menu-button').addEventListener('click', () => {
                document.getElementById('mobile-menu').classList.toggle('hidden');
            });
            fetchIssues();
        });
    </script>
</body>
</html>
