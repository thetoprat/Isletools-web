<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bugs & Issues - IsleTools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #000000; background-image: radial-gradient(circle at top, hsl(0, 0%, 8%), #000 60%); color: #EAEAEA; }
        .modal { @apply fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center z-50 transition-opacity duration-300; }
        .modal-content { @apply bg-gray-900 border border-gray-800 rounded-lg shadow-2xl w-full max-w-3xl h-[80vh] flex flex-col; }
        .modal-body { @apply p-8 overflow-y-auto; }
        .modal-body h3 { @apply text-2xl font-bold text-white mb-4; }
        .modal-body p { @apply text-gray-300 mb-4; }
        .modal-body ul { @apply list-disc list-inside text-gray-300 mb-4; }
        .modal-body pre { @apply bg-black rounded-md p-4 text-sm text-gray-300 overflow-x-auto; }
        .modal-body code { @apply font-mono; }
        .interactive-glow {
            position: relative;
        }
        .interactive-glow::before, .interactive-glow::after {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            border-radius: inherit;
            opacity: var(--glow-opacity, 0);
            transition: opacity 0.3s ease-in-out;
        }
        .interactive-glow::before {
            background: radial-gradient(
                var(--glow-size, 350px) circle at var(--mouse-x) var(--mouse-y),
                rgba(168, 85, 247, 0.1),
                transparent 40%
            );
            z-index: 1;
        }
        .interactive-glow::after {
            --border-size: 1px;
            background: conic-gradient(
                from var(--border-angle, 0deg) at 50% 50%,
                transparent, rgba(168, 85, 247, 0.8), transparent 20%
            );
            z-index: 0;
            inset: calc(-1 * var(--border-size));
            -webkit-mask: 
                linear-gradient(#fff 0 0) content-box, 
                linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <!-- Header -->
    <div class="sticky top-4 z-50 px-4">
        <header class="interactive-glow container mx-auto bg-gray-900/60 backdrop-blur-sm border border-gray-800 rounded-full">
            <nav class="px-4 py-2">
                <div class="flex items-center justify-between">
                    <div class="text-white font-bold text-xl ml-2"><a href="index.html">IsleTools</a></div>
                    <div class="hidden md:flex items-center space-x-2 bg-gray-900/80 rounded-full p-1">
                        <a href="index.html" class="flex items-center gap-x-2 text-gray-400 hover:text-white hover:bg-gray-800/50 transition-all duration-300 px-3 py-1.5 rounded-full text-sm font-medium">
                            <span class="material-icons-outlined text-base">home</span>
                            Home
                        </a>
                        <a href="blog.html" class="flex items-center gap-x-2 text-gray-400 hover:text-white hover:bg-gray-800/50 transition-all duration-300 px-3 py-1.5 rounded-full text-sm font-medium">
                            <span class="material-icons-outlined text-base">article</span>
                            Blog
                        </a>
                        <a href="bugs.html" class="flex items-center gap-x-2 bg-gray-800 text-white transition-all duration-300 px-3 py-1.5 rounded-full text-sm font-medium">
                            <span class="material-icons-outlined text-base">bug_report</span>
                            Bugs & Issues
                        </a>
                    </div>
                    <div class="hidden md:block">
                         <a href="https://github.com/thetoprat/isletools" target="_blank" class="bg-gray-800 px-4 py-2 rounded-full text-sm font-medium text-white hover:bg-gray-700 transition-colors">GitHub</a>
                    </div>
                    <div class="md:hidden">
                        <button id="mobile-menu-button" class="text-white focus:outline-none p-2">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path></svg>
                        </button>
                    </div>
                </div>
            </nav>
        </header>
         <div id="mobile-menu" class="hidden md:hidden mt-2 bg-gray-900/90 backdrop-blur-sm border border-gray-800 rounded-2xl p-4 space-y-2">
            <a href="index.html" class="block text-gray-400 hover:text-white hover:bg-gray-800/50 transition-all duration-300 px-3 py-1.5 rounded-full text-sm font-medium text-center">Home</a>
            <a href="blog.html" class="block text-gray-400 hover:text-white hover:bg-gray-800/50 transition-all duration-300 px-3 py-1.5 rounded-full text-sm font-medium text-center">Blog</a>
            <a href="bugs.html" class="block bg-gray-800 text-white transition-all duration-300 px-3 py-1.5 rounded-full text-sm font-medium text-center">Bugs & Issues</a>
            <a href="https://github.com/thetoprat/isletools" target="_blank" class="block mt-2 bg-gray-800 px-4 py-2 rounded-lg text-sm font-medium text-white hover:bg-gray-700 transition text-center">GitHub</a>
        </div>
    </div>

    <main class="container mx-auto px-6 py-16 flex-grow">
        <div class="text-center mb-12 pt-12">
            <h1 class="text-4xl font-bold text-white">Bugs & Issues</h1>
            <p class="text-gray-400 mt-2">A live look at open issues from the GitHub repository.</p>
        </div>
        <div id="issues-container" class="max-w-4xl mx-auto space-y-4">
            <p class="text-center text-gray-400">Loading issues...</p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-gray-900">
        <div class="container mx-auto px-6 py-8 text-center text-gray-500">
            <p>&copy; 2024 IsleTools. All Rights Reserved.</p>
        </div>
    </footer>

    <!-- Issue Modal -->
    <div id="issue-modal" class="modal hidden opacity-0">
        <div class="modal-content">
            <div id="modal-header" class="p-4 border-b border-gray-800 flex justify-between items-center">
                <h2 id="modal-title" class="text-xl font-bold text-white"></h2>
                <button id="close-modal-button" class="text-gray-400 hover:text-white">&times;</button>
            </div>
            <div id="modal-body" class="modal-body">
                <!-- Issue content will be injected here -->
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const GITHUB_REPO = "thetoprat/isletools";
            let issuesCache = [];

            const modal = document.getElementById('issue-modal');
            const modalTitle = document.getElementById('modal-title');
            const modalBody = document.getElementById('modal-body');
            const closeModalButton = document.getElementById('close-modal-button');

            function setupGlowEffect() {
                const interactiveElements = document.querySelectorAll('.interactive-glow');
                interactiveElements.forEach(elem => {
                    elem.style.setProperty('--glow-opacity', 0); // Ensure it starts hidden
                    const rect = elem.getBoundingClientRect();
                    elem.style.setProperty('--glow-size', `${Math.max(rect.width, rect.height) * 1.5}px`);

                    elem.addEventListener('mousemove', (e) => {
                        const rect = elem.getBoundingClientRect();
                        const x = e.clientX - rect.left;
                        const y = e.clientY - rect.top;
                        
                        const centerX = rect.width / 2;
                        const centerY = rect.height / 2;
                        const angle = Math.atan2(y - centerY, x - centerX) * (180 / Math.PI);

                        elem.style.setProperty('--mouse-x', `${x}px`);
                        elem.style.setProperty('--mouse-y', `${y}px`);
                        elem.style.setProperty('--border-angle', `${angle}deg`);
                    });

                    elem.addEventListener('mouseenter', () => {
                        elem.style.setProperty('--glow-opacity', 1);
                    });

                    elem.addEventListener('mouseleave', () => {
                        elem.style.setProperty('--glow-opacity', 0);
                    });
                });
            }

            function parseMarkdown(text) {
                if (!text) return '<p>No description provided.</p>';
                return text
                    .replace(/### (.*)/g, '<h3 class="text-xl font-bold text-white mt-4 mb-2">$1</h3>')
                    .replace(/## (.*)/g, '<h2 class="text-2xl font-bold text-white mt-6 mb-3">$1</h2>')
                    .replace(/# (.*)/g, '<h1 class="text-3xl font-bold text-white mt-8 mb-4">$1</h1>')
                    .replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>')
                    .replace(/`([^`]+)`/g, '<code class="bg-gray-800 px-1 py-0.5 rounded-md">$1</code>')
                    .replace(/\* (.*)/g, '<ul><li>$1</li></ul>') // Basic list support
                    .replace(/(\r\n|\n|\r)/gm, "<br>");
            }
            
            function openModal(issue) {
                modalTitle.textContent = `#${issue.number} - ${issue.title}`;
                modalBody.innerHTML = parseMarkdown(issue.body);
                modal.classList.remove('hidden');
                setTimeout(() => modal.classList.remove('opacity-0'), 10);
            }

            function closeModal() {
                modal.classList.add('opacity-0');
                setTimeout(() => modal.classList.add('hidden'), 300);
            }

            closeModalButton.addEventListener('click', closeModal);
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    closeModal();
                }
            });

            async function fetchIssues() {
                const issuesContainer = document.getElementById('issues-container');
                try {
                    const response = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/issues?state=open`);
                    if (!response.ok) throw new Error(`GitHub API error: ${response.statusText}`);
                    issuesCache = await response.json();

                    if (issuesCache.length === 0) {
                        issuesContainer.innerHTML = '<p class="text-center text-gray-400">No open issues found. Great job!</p>';
                        return;
                    }

                    issuesContainer.innerHTML = '';
                    issuesCache.forEach((issue, index) => {
                        if (issue.pull_request) return;

                        const issueEl = document.createElement('div');
                        issueEl.className = 'interactive-glow block bg-gray-900/50 border border-gray-800 rounded-lg p-5 hover:border-gray-700 transition-colors duration-300 cursor-pointer';
                        issueEl.dataset.issueIndex = index;
                        
                        let labelsHTML = '';
                        issue.labels.forEach(label => {
                            labelsHTML += `<span class="text-xs font-semibold mr-2 px-2.5 py-0.5 rounded" style="background-color:#${label.color}; color:${getContrastYIQ(label.color)}">${label.name}</span>`;
                        });

                        issueEl.innerHTML = `
                            <div class="flex justify-between items-start">
                                <h3 class="text-lg font-bold text-white mb-2 pr-4">${issue.title}</h3>
                                <div class="text-right flex-shrink-0">
                                    <span class="font-semibold text-sm text-white">${issue.user.login}</span>
                                    <p class="text-xs text-gray-400">${new Date(issue.created_at).toLocaleDateString()}</p>
                                </div>
                            </div>
                            <div class="mt-3">${labelsHTML}</div>
                        `;
                        issuesContainer.appendChild(issueEl);

                        issueEl.addEventListener('click', () => {
                            const clickedIssue = issuesCache[issueEl.dataset.issueIndex];
                            openModal(clickedIssue);
                        });
                    });
                    setupGlowEffect();
                } catch (error) {
                    console.error("Failed to fetch issues:", error);
                    issuesContainer.innerHTML = `<p class="text-red-400 text-center">Could not load issues data.</p>`;
                }
            }
            
            function getContrastYIQ(hexcolor){
                hexcolor = hexcolor.replace("#", "");
                const r = parseInt(hexcolor.substr(0,2),16);
                const g = parseInt(hexcolor.substr(2,2),16);
                const b = parseInt(hexcolor.substr(4,2),16);
                const yiq = ((r*299)+(g*587)+(b*114))/1000;
                return (yiq >= 128) ? 'black' : 'white';
            }

            document.getElementById('mobile-menu-button').addEventListener('click', () => {
                document.getElementById('mobile-menu').classList.toggle('hidden');
            });

            fetchIssues();
            setupGlowEffect();
        });
    </script>
</body>
</html>
