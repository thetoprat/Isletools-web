<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog - IsleTools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #000000; background-image: radial-gradient(circle at top, hsl(0, 0%, 8%), #000 60%); color: #EAEAEA; }
        .details-content { @apply p-6 pt-4; }
        .interactive-glow { position: relative; }
        .interactive-glow::before, .interactive-glow::after { content: ""; position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; border-radius: inherit; opacity: var(--glow-opacity, 0); transition: opacity 0.3s ease-in-out; }
        .interactive-glow::before { background: radial-gradient(var(--glow-size, 350px) circle at var(--mouse-x) var(--mouse-y), rgba(168, 85, 247, 0.1), transparent 40%); z-index: 1; }
        .interactive-glow::after { --border-size: 1px; background: conic-gradient(from var(--border-angle, 0deg) at 50% 50%, transparent, rgba(168, 85, 247, 0.8), transparent 20%); z-index: 0; inset: calc(-1 * var(--border-size)); -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
        summary::-webkit-details-marker { display: none; }
        
        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .modal-content {
            position: relative;
            background: linear-gradient(135deg, #1f2937 0%, #111827 100%);
            border: 1px solid #374151;
            border-radius: 1rem;
            max-width: 4xl;
            max-height: 90vh;
            overflow-y: auto;
            transform: scale(0.9) translateY(20px);
            transition: transform 0.3s ease;
        }
        .modal-overlay.active .modal-content {
            transform: scale(1) translateY(0);
        }
        
        /* Markdown Content Styles */
        .markdown-content h1, .markdown-content h2, .markdown-content h3, .markdown-content h4, .markdown-content h5, .markdown-content h6 {
            color: #ffffff;
            font-weight: 600;
            margin-top: 1.5rem;
            margin-bottom: 0.75rem;
        }
        .markdown-content h1 { font-size: 2rem; }
        .markdown-content h2 { font-size: 1.5rem; }
        .markdown-content h3 { font-size: 1.25rem; }
        .markdown-content p {
            margin-bottom: 1rem;
            line-height: 1.6;
            color: #d1d5db;
        }
        .markdown-content code {
            background: #374151;
            color: #a78bfa;
            padding: 0.125rem 0.25rem;
            border-radius: 0.25rem;
            font-size: 0.875rem;
        }
        .markdown-content pre {
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 0.5rem;
            padding: 1rem;
            overflow-x: auto;
            margin: 1rem 0;
        }
        .markdown-content pre code {
            background: none;
            padding: 0;
            color: #e5e7eb;
        }
        .markdown-content ul, .markdown-content ol {
            margin: 1rem 0;
            padding-left: 1.5rem;
            color: #d1d5db;
        }
        .markdown-content li {
            margin-bottom: 0.5rem;
        }
        .markdown-content blockquote {
            border-left: 4px solid #a78bfa;
            padding-left: 1rem;
            margin: 1rem 0;
            font-style: italic;
            color: #9ca3af;
        }
        .markdown-content a {
            color: #a78bfa;
            text-decoration: underline;
        }
        .markdown-content a:hover {
            color: #c4b5fd;
        }
    </style>
</head>
<body>
    <div class="flex flex-col min-h-screen">
        <!-- Header -->
        <div class="sticky top-4 z-50 px-4">
            <header class="interactive-glow container mx-auto bg-gray-900/60 backdrop-blur-sm border border-gray-800 rounded-full">
                <nav class="px-4 py-2">
                    <div class="flex items-center justify-between">
                        <div class="text-white font-bold text-xl ml-2"><a href="index.html">IsleTools</a></div>
                        <div class="hidden md:flex items-center space-x-2 bg-gray-900/80 rounded-full p-1">
                            <a href="index.html" class="flex items-center gap-x-2 text-gray-400 hover:text-white hover:bg-gray-800/50 transition-all duration-300 px-3 py-1.5 rounded-full text-sm font-medium"><span class="material-icons-outlined text-base">home</span>Home</a>
                            <a href="blog.html" class="flex items-center gap-x-2 bg-gray-800 text-white transition-all duration-300 px-3 py-1.5 rounded-full text-sm font-medium"><span class="material-icons-outlined text-base">article</span>Blog</a>
                            <a href="bugs.html" class="flex items-center gap-x-2 text-gray-400 hover:text-white hover:bg-gray-800/50 transition-all duration-300 px-3 py-1.5 rounded-full text-sm font-medium"><span class="material-icons-outlined text-base">bug_report</span>Bugs & Issues</a>
                        </div>
                        <div class="hidden md:block"><a href="https://github.com/thetoprat/isletools" target="_blank" class="bg-gray-800 px-4 py-2 rounded-full text-sm font-medium text-white hover:bg-gray-700 transition-colors">GitHub</a></div>
                        <div class="md:hidden"><button id="mobile-menu-button" class="text-white focus:outline-none p-2"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path></svg></button></div>
                    </div>
                </nav>
            </header>
             <div id="mobile-menu" class="hidden md:hidden mt-2 bg-gray-900/90 backdrop-blur-sm border border-gray-800 rounded-2xl p-4 space-y-2">
                <a href="index.html" class="block text-gray-400 hover:text-white hover:bg-gray-800/50 transition-all duration-300 px-3 py-1.5 rounded-full text-sm font-medium text-center">Home</a>
                <a href="blog.html" class="block bg-gray-800 text-white transition-all duration-300 px-3 py-1.5 rounded-full text-sm font-medium text-center">Blog</a>
                <a href="bugs.html" class="block text-gray-400 hover:text-white hover:bg-gray-800/50 transition-all duration-300 px-3 py-1.5 rounded-full text-sm font-medium text-center">Bugs & Issues</a>
                <a href="https://github.com/thetoprat/isletools" target="_blank" class="block mt-2 bg-gray-800 px-4 py-2 rounded-lg text-sm font-medium text-white hover:bg-gray-700 transition text-center">GitHub</a>
            </div>
        </div>

        <main class="container mx-auto px-6 py-16 flex-grow">
            <div class="text-center mb-12 pt-12">
                <h1 class="text-4xl font-bold text-white">Developer Blog</h1>
                <p class="text-gray-400 mt-2">Insights, tutorials, and updates from the IsleTools team.</p>
            </div>
            <div id="blog-posts-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                <!-- Blog posts will be rendered here by JavaScript -->
            </div>
        </main>

        <footer class="border-t border-gray-900"><div class="container mx-auto px-6 py-8 text-center text-gray-500"><p>&copy; 2024 IsleTools. All Rights Reserved.</p></div></footer>
    </div>

    <!-- Modal -->
    <div id="blog-modal" class="modal-overlay">
        <div class="flex items-center justify-center min-h-screen p-4">
            <div class="modal-content w-full max-w-4xl">
                <div class="flex items-center justify-between p-6 border-b border-gray-700">
                    <div>
                        <h2 id="modal-title" class="text-2xl font-bold text-white"></h2>
                        <p id="modal-date" class="text-sm text-gray-400 mt-1"></p>
                    </div>
                    <button id="close-modal" class="text-gray-400 hover:text-white transition-colors p-2 rounded-full hover:bg-gray-800">
                        <span class="material-icons-outlined">close</span>
                    </button>
                </div>
                <div id="modal-content" class="p-6 markdown-content">
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- BLOG POSTS ---
            const blogPosts = [
                {
                    date: "July 1, 2025",
                    title: "Welcome to the New IsleTools Blog!",
                    content: `# Welcome to IsleTools Blog! 🎉

This is the very first post on our **brand new blog**. We're excited to share updates, tutorials, and user guides with our growing community.

## What to Expect

- **Feature Updates**: Latest tools and improvements
- **User Guides**: Step-by-step tutorials for all IsleTools features
- **Tips & Tricks**: Pro tips to get the most out of your server management

> Stay tuned for helpful content to enhance your server administration experience!

### Getting Started

If you're new to IsleTools, here are some quick links:

- [Home Page](index.html) - Discover all our tools
- [GitHub Repository](https://github.com/thetoprat/isletools) - View the project
- [Bug Reports](bugs.html) - Report issues or request features

---

*Thank you for being part of our community!*`
                }
            ];

            function setupGlowEffect() {
                document.querySelectorAll('.interactive-glow').forEach(elem => {
                    const rect = elem.getBoundingClientRect();
                    elem.style.setProperty('--glow-size', `${Math.max(rect.width, rect.height) * 1.5}px`);
                    elem.addEventListener('mousemove', e => {
                        const rect = elem.getBoundingClientRect();
                        const x = e.clientX - rect.left, y = e.clientY - rect.top;
                        const angle = Math.atan2(y - rect.height / 2, x - rect.width / 2) * (180 / Math.PI);
                        elem.style.setProperty('--mouse-x', `${x}px`);
                        elem.style.setProperty('--mouse-y', `${y}px`);
                        elem.style.setProperty('--border-angle', `${angle}deg`);
                    });
                    elem.addEventListener('mouseenter', () => elem.style.setProperty('--glow-opacity', 1));
                    elem.addEventListener('mouseleave', () => elem.style.setProperty('--glow-opacity', 0));
                });
            }

            function openModal(post) {
                const modal = document.getElementById('blog-modal');
                const modalTitle = document.getElementById('modal-title');
                const modalDate = document.getElementById('modal-date');
                const modalContent = document.getElementById('modal-content');
                
                modalTitle.textContent = post.title;
                modalDate.textContent = post.date;
                modalContent.innerHTML = marked.parse(post.content);
                
                modal.classList.add('active');
                document.body.style.overflow = 'hidden'; // Prevent background scrolling
            }

            function closeModal() {
                const modal = document.getElementById('blog-modal');
                modal.classList.remove('active');
                document.body.style.overflow = ''; // Restore scrolling
            }

            function renderBlogPosts() {
                const container = document.getElementById('blog-posts-container');
                if (!blogPosts || blogPosts.length === 0) {
                    container.innerHTML = '<p class="text-center col-span-full text-gray-400">No blog posts yet.</p>';
                    return;
                }
                
                container.innerHTML = ''; // Clear existing content
                
                blogPosts.forEach((post, index) => {
                    const cardEl = document.createElement('div');
                    cardEl.className = "interactive-glow bg-gray-900/50 border border-gray-800 rounded-xl overflow-hidden shadow-lg hover:border-gray-700 transition-all duration-300 cursor-pointer";
                    
                    // Extract plain text preview from markdown
                    const plainTextPreview = post.content.replace(/[#*`>\-\[\]]/g, '').replace(/\n+/g, ' ').substring(0, 120) + '...';
                    
                    cardEl.innerHTML = `
                        <div class="p-6">
                            <p class="text-sm text-gray-400 mb-2">${post.date}</p>
                            <h3 class="font-bold text-xl text-white mb-3">${post.title}</h3>
                            <p class="text-gray-300 line-clamp-3">${plainTextPreview}</p>
                            <div class="mt-4 pt-4 border-t border-gray-800">
                                <span class="inline-flex items-center text-purple-400 text-sm font-medium hover:text-purple-300 transition-colors">
                                    Read More
                                    <span class="material-icons-outlined ml-1 text-base">arrow_forward</span>
                                </span>
                            </div>
                        </div>
                    `;
                    
                    cardEl.addEventListener('click', () => openModal(post));
                    container.appendChild(cardEl);
                });

                // Re-run the glow effect setup after posts are rendered
                setupGlowEffect();
            }

            // Modal event listeners
            document.getElementById('close-modal').addEventListener('click', closeModal);
            document.getElementById('blog-modal').addEventListener('click', (e) => {
                if (e.target === document.getElementById('blog-modal')) {
                    closeModal();
                }
            });
            
            // ESC key to close modal
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    closeModal();
                }
            });

            document.getElementById('mobile-menu-button').addEventListener('click', () => {
                document.getElementById('mobile-menu').classList.toggle('hidden');
            });
            
            // Render the posts from the local array
            renderBlogPosts();
            
            // Setup glow effect for static elements
            setupGlowEffect();
        });
    </script>
</body>
</html>
